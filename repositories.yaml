# Clever Cloud Example Repositories
# Last generated: 2026-03-10
# Dates are based on the last commit on the default branch
#
# Status values:
#   active   - Repository is maintained and available
#   archived - Repository is archived on GitHub
#   fixed      - Example works but won't receive updates (pinned to specific versions)
#   deprecated - Upstream project is discontinued or no longer maintained
#   no_repo    - Placeholder for planned examples with no repository yet
#
# Structure:
#   Each top-level key is a section (rendered as ## heading)
#   Each sub-key is a category (rendered as ### heading)
#   Use title to set the display name for sections and categories
#   Sub-keys containing arrays of examples are rendered as tables

